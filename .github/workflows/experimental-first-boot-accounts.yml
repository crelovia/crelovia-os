name: First boot target and account preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Podman
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build previously validated KDE image
        shell: bash
        run: |
          set -euo pipefail
          podman build --file build/Containerfile.desktop-cleanup --tag localhost/crelovia-first-boot-preflight:dev .
      - name: Inspect first-boot configuration (read-only)
        shell: bash
        run: |
          set -euo pipefail
          podman run --rm --mount "type=bind,src=${{ github.workspace }}/build/inspect-first-boot.sh,dst=/usr/local/share/crelovia-inspect-first-boot.sh,ro" localhost/crelovia-first-boot-preflight:dev bash /usr/local/share/crelovia-inspect-first-boot.sh
      # No image distribution, user/password creation, systemd activation, or host disk changes.
