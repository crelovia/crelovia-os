# Manually dispatched, derived DIAGNOSTIC-ONLY image; not a production build.
# Does NOT provision a login account, publish a disk, or prove KDE works.
name: Experimental KDE KVM-accelerated first light

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Choose standard 14-GB runner or a preconfigured trusted larger ephemeral runner"
        type: choice
        required: true
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - crelovia-kvm-large

permissions:
  contents: read

concurrency:
  group: crelovia-kde-kvm-first-light
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 105
    steps:
      - name: Checkout protected source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Inspect throwaway runner resources
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          df -h . / /var 2>/dev/null || true
          free -h
          echo 'Selected runner label: ${{ inputs.runner_label }}'
          echo 'A 14-GB standard runner is expected to fail the conservative storage gate.'
          echo "=== Acceleration capability probe (no mode change in this experiment) ==="
          if [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM device accessible to job user; consider separate accelerated-VM experiment after review."
          else
            echo "KVM device inaccessible; retain known software-emulation path."
          fi
          ls -l /dev/kvm 2>&1 || true
          # Fedora KDE image builds may require >14 GiB available during layer commits.
          # A conservative 22-GiB initial budget avoids consuming the standard runner's
          # entire root filesystem. The threshold is a guard, NOT a measured peak.
          free_kib=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "Free root storage: $((free_kib / 1024)) MiB"
          if (( free_kib < 22 * 1024 * 1024 )); then
            echo '::error::DISK_BUDGET_UNAVAILABLE: need >=22 GiB free on the root filesystem before image build.'
            echo 'Standard ubuntu-24.04 GitHub runners have 14 GB total SSD.'
            echo 'Use a separately configured, trusted ephemeral larger runner (crelovia-kvm-large), only after explicit billing review.'
            exit 1
          fi

      - name: Install Podman, QCOW2 and UEFI emulation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman qemu-system-x86 qemu-utils ovmf socat python3-pil
          podman --version
          qemu-system-x86_64 --version
          qemu-img --version

      - name: Recheck disk budget after installing QEMU and Podman
        shell: bash
        run: |
          set -euo pipefail
          # Rootful Podman stores images here. Confirm its backing device is large enough.
          sudo mkdir -p /var/lib/containers/storage
          df -h /var/lib/containers/storage .
          free_kib=$(df -Pk /var/lib/containers/storage | awk 'NR==2 {print $4}')
          if (( free_kib < 20 * 1024 * 1024 )); then
            echo '::error::DISK_BUDGET_UNAVAILABLE: <20 GiB free after prerequisite installation.'
            exit 1
          fi

      - name: Require functioning KVM before any image build
        shell: bash
        run: |
          set -euo pipefail
          echo '=== KVM acceleration gate (diagnostic-only; no module changes) ==='
          if [[ ! -c /dev/kvm ]]; then
            echo '::error::KVM_UNAVAILABLE: /dev/kvm is absent on this GitHub-hosted runner.'
            echo '## KVM gate: NOT AVAILABLE' >> "$GITHUB_STEP_SUMMARY"
            echo 'No Crelovia disk was built or guest started. Use an isolated KVM-capable Linux VM/runner for the next experiment.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          sudo test -r /dev/kvm && sudo test -w /dev/kvm || {
            echo '::error::KVM_UNAVAILABLE: /dev/kvm cannot be accessed with sudo.'
            exit 1
          }
          # Validate that QEMU can actually initialize KVM; a device node alone
          # does not establish usable nested virtualization.
          set +e
          sudo timeout --signal=TERM --kill-after=2s 5s \
            qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host \
            -nodefaults -display none -monitor none -serial none -S \
            > kvm-preflight.log 2>&1
          probe_status=$?
          set -e
          if [[ "$probe_status" -ne 124 ]]; then
            cat kvm-preflight.log
            echo "::error::KVM_UNAVAILABLE: QEMU KVM initialization probe exited $probe_status (expected timeout=124)."
            exit 1
          fi
          echo 'KVM_AVAILABLE: QEMU initialized and remained running until the intentional five-second timeout.'
          {
            echo '## KVM gate: AVAILABLE'
            echo 'QEMU KVM initialization succeeded. Image build and real boot test may proceed; no guest boot has been verified yet.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the existing KDE image in rootful Podman
        shell: bash
        run: |
          set -euo pipefail
          sudo podman build --file build/Containerfile.desktop-cleanup --tag localhost/crelovia-kde-uefi:dev .
          sudo podman image inspect localhost/crelovia-kde-uefi:dev --format 'KDE source OCI image ID: {{.Id}}'
          df -h /var/lib/containers/storage .

      - name: Derive disposable serial diagnostic image without changing baseline
        shell: bash
        run: |
          set -euo pipefail
          sudo podman build --file build/Containerfile.desktop-serial-diag --tag localhost/crelovia-kde-serial-diag:dev .
          sudo podman image inspect localhost/crelovia-kde-serial-diag:dev --format 'Diagnostic source OCI image ID: {{.Id}}'
          sudo podman run --rm localhost/crelovia-kde-serial-diag:dev bash -c '
            set -eu
            test -x /usr/local/libexec/crelovia-diag-graphical-serial.sh
            test -f /usr/lib/systemd/system/crelovia-graphical-diag.service
            test -L /etc/systemd/system/multi-user.target.wants/crelovia-graphical-diag.service
          '

      - name: Inspect SDDM and display configuration before conversion (read-only)
        shell: bash
        run: |
          set -euo pipefail
          # Static checks in the unbooted OCI image. Do not read shadow,
          # private credentials or user home directories.
          sudo podman run --rm localhost/crelovia-kde-uefi:dev bash -c '
            set -eu
            echo "=== Installed graphical packages ==="
            rpm -q sddm sddm-wayland-plasma plasma-workspace kwin || true
            echo "=== Effective boot/display manager symlinks ==="
            ls -l /etc/systemd/system/default.target /usr/lib/systemd/system/default.target /etc/systemd/system/display-manager.service /usr/lib/systemd/system/sddm.service 2>&1 || true
            echo "=== SDDM unit dependencies / commands ==="
            sed -n "1,140p" /usr/lib/systemd/system/sddm.service 2>&1 || true
            echo "=== Available session and display files ==="
            ls -l /usr/share/wayland-sessions /usr/share/xsessions /usr/libexec/sddm* 2>&1 || true
            echo "=== Relevant graphics packages ==="
            rpm -qa | grep -Ei "^(mesa|libdrm|xorg-x11-server|qt6|sddm)" | sort | head -70 || true
          '

      - name: Convert bootc container to throwaway QCOW2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          builder=ghcr.io/osbuild/image-builder-cli:latest
          sudo podman pull "$builder"
          sudo podman image inspect "$builder" --format 'image-builder OCI image ID: {{.Id}}'
          sudo podman run --rm "$builder" version
          df -h /var/lib/containers/storage .
          sudo podman run --rm --privileged \
            --volume "$PWD/output:/output" \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            "$builder" build \
            --bootc-ref localhost/crelovia-kde-serial-diag:dev \
            --bootc-default-fs ext4 qcow2
          image_path=$(sudo find output -type f -name '*.qcow2' -print -quit)
          test -n "$image_path"
          sudo qemu-img info --output=json "$image_path" > qcow2-info.json
          jq -e '.format == "qcow2" and (."virtual-size" > 0)' qcow2-info.json
          echo "DISK_PATH=$image_path" >> "$GITHUB_ENV"

      - name: Boot headless UEFI guest and capture unattended display
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          # Prefer Ubuntu's 4 MB OVMF pair and fall back to the legacy matching pair.
          if [[ -f /usr/share/OVMF/OVMF_CODE_4M.fd && -f /usr/share/OVMF/OVMF_VARS_4M.fd ]]; then
            code=/usr/share/OVMF/OVMF_CODE_4M.fd
            vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          elif [[ -f /usr/share/OVMF/OVMF_CODE.fd && -f /usr/share/OVMF/OVMF_VARS.fd ]]; then
            code=/usr/share/OVMF/OVMF_CODE.fd
            vars=/usr/share/OVMF/OVMF_VARS.fd
          else
            echo '::error::No matching OVMF firmware code/vars pair found.'
            exit 1
          fi
          cp "$vars" evidence/OVMF_VARS.fd
          # The VM sees only the generated QCOW2 and its private, temporary UEFI vars.
          # -nic none means no network device; no host folders or interactive credentials.
          # Hardware KVM is mandatory here; fail-fast gate ran before image build.
          sudo timeout --signal=TERM --kill-after=8s 360s qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host -smp 2 -m 4096 \
            -drive if=pflash,format=raw,unit=0,readonly=on,file="$code" \
            -drive if=pflash,format=raw,unit=1,file="$PWD/evidence/OVMF_VARS.fd" \
            -drive if=virtio,format=qcow2,file="$DISK_PATH",cache=none \
            -nic none -display none -vga std \
            -monitor unix:"$PWD/evidence/monitor.sock",server=on,wait=off \
            -serial file:"$PWD/evidence/serial.log" \
            -no-reboot &
          vm_pid=$!
          last_delay=0
          for delay in 30 60 120 180 240; do
            sleep "$((delay - last_delay))"
            last_delay=$delay
            if [[ -S evidence/monitor.sock ]]; then
              # QEMU monitor evidence describes the emulated VGA device and guest state;
              # it does not prove a guest display manager launched.
              {
                echo "===== T+$delay seconds ====="
                for query in 'info status' 'info block'; do
                  echo ">>> $query"
                  printf '%s\r\n' "$query" | sudo socat -t 8 - UNIX-CONNECT:"$PWD/evidence/monitor.sock" || true
                done
              } >> evidence/qemu-monitor-info.txt 2>&1
              frame="evidence/frame-$delay.ppm"
              printf 'screendump %s\r\n' "$PWD/$frame" | sudo socat -t 8 - UNIX-CONNECT:"$PWD/evidence/monitor.sock" || true
              if sudo test -s "$frame"; then
                sudo python3 - "$frame" <<'PY'
          import sys
          from PIL import Image
          path = sys.argv[1]
          with Image.open(path) as img:
              img.save(path.replace(".ppm", ".png"))
          PY
                sudo rm -f "$frame"
              fi
            fi
          done
          # Stop only the QEMU process started by this job (and its timeout wrapper).
          sudo pkill -TERM -f '^qemu-system-x86_64 -machine q35,accel=kvm' || true
          wait "$vm_pid" || true
          echo 'UEFI guest boot attempt finished; interpreting the screens requires human review.'
          echo 'Static SDDM checks and QEMU VGA state are evidence, not a login proof.'
          sudo ls -lh evidence/*.png evidence/serial.log 2>/dev/null || true
          if ! sudo find evidence -maxdepth 1 -type f -name 'frame-*.png' | grep -q .; then
            echo '::error::No graphical frame captured. Inspect conversion/firmware/monitor logs.'
            exit 1
          fi

      - name: Record interpretation boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## Crelovia KVM accelerated graphical serial diagnostics'
            echo '- Container build and QCOW2 conversion: refer to steps above'
            echo '- QEMU UEFI startup: launched if prior steps succeeded'
            echo '- Capture frames at 30, 60, 120, 180 and 240 seconds, plus QEMU monitor status/block snapshots; inspect manually'
            echo '- Diagnostic service writes scoped journal snapshots to serial if it starts'
            echo '- SDDM, KDE, working login, networking, SELinux and rollback: **NOT VERIFIED**'
            echo '- No guest NIC, host disk passthrough, embedded users/passwords or published disk image'
            echo '- KVM required and initialized in preflight; job fails before building if unavailable; boot result still requires log/screenshot review'
            echo '- Fedora and converter image inputs: floating; not release reproducible'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload short-lived screenshots and serial evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crelovia-kvm-graphical-evidence
          path: |
            evidence/frame-*.png
            evidence/serial.log
            evidence/qemu-monitor-info.txt
            qcow2-info.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
