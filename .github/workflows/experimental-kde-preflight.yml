name: Experimental KDE boot readiness preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Podman
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build known-good experimental KDE container
        shell: bash
        run: |
          set -euo pipefail
          podman build --file build/Containerfile.desktop-cleanup --tag localhost/crelovia-kde-preflight:dev .
      - name: Inventory first-boot prerequisites without changes
        shell: bash
        run: |
          set -euo pipefail
          podman run --rm --mount "type=bind,src=${{ github.workspace }}/build/preflight-boot.sh,dst=/usr/local/share/crelovia-preflight.sh,ro" localhost/crelovia-kde-preflight:dev bash /usr/local/share/crelovia-preflight.sh
      # Do not enable services, create accounts, generate disk images or publish artifacts.
