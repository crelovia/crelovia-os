name: Validate source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate initial build metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f build/Containerfile
          test -f build/crelovia-release-info
          grep -Fxq 'FROM quay.io/fedora/fedora-bootc:43' build/Containerfile
          grep -Fxq 'STAGE=experimental' build/crelovia-release-info
          grep -Fq 'RUN bootc container lint' build/Containerfile
          test -f SECURITY.md
          test -f docs/ARCHITECTURE.md
          test -f docs/ROADMAP.md
          test -f CONTRIBUTING.md
          echo 'Crelovia source metadata check passed (static checks only).'
      - name: Syntax-check shell diagnostics
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(build/*.sh)
          if (( ${#scripts[@]} == 0 )); then
            echo 'No shell scripts found under build/'
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "Checking $script"
            bash -n "$script"
          done
          echo "Shell syntax checks passed: ${#scripts[@]} scripts."
